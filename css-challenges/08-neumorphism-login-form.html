<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge 08 - Neumorphism Login Form</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#e0e5ec;
}

.container{

    width:360px;
    background:#e0e5ec;
    padding:40px;
    border-radius:25px;

    box-shadow:
    12px 12px 24px #a3b1c6,
    -12px -12px 24px #ffffff;
}

.avatar{

    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    background:#e0e5ec;

    box-shadow:
    8px 8px 18px #a3b1c6,
    -8px -8px 18px #ffffff;
}

h2{

    text-align:center;
    margin-top:20px;
    color:#333;
}

p{

    text-align:center;
    color:#666;
    font-size:14px;
    margin-top:5px;
    margin-bottom:25px;
}

.inputBox{

    margin-bottom:18px;
}

.inputBox input{

    width:100%;
    padding:15px 18px;
    border:none;
    outline:none;
    font-size:15px;
    border-radius:15px;
    background:#e0e5ec;

    box-shadow:
    inset 6px 6px 12px #c5ccd6,
    inset -6px -6px 12px #ffffff;

    transition:.3s;
}

.inputBox input:focus{

    box-shadow:
    inset 3px 3px 8px #c5ccd6,
    inset -3px -3px 8px #ffffff;

    border:2px solid #4a90e2;
}

.options{

    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:14px;
}

.options a{

    text-decoration:none;
    color:#4a90e2;
    transition:.3s;
}

.options a:hover{

    color:#2d6fd2;
}

button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#4a90e2;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;

    box-shadow:
    5px 5px 12px #a3b1c6,
    -5px -5px 12px #ffffff;
}

button:hover{

    transform:translateY(-3px);
}

button:active{

    transform:scale(.97);

    box-shadow:
    inset 3px 3px 8px rgba(0,0,0,.2),
    inset -3px -3px 8px rgba(255,255,255,.2);
}

.divider{

    margin:28px 0;
    text-align:center;
    color:#777;
    position:relative;
}

.divider::before{

    content:"";
    position:absolute;
    width:40%;
    height:1px;
    background:#b8bec8;
    left:0;
    top:50%;
}

.divider::after{

    content:"";
    position:absolute;
    width:40%;
    height:1px;
    background:#b8bec8;
    right:0;
    top:50%;
}

.social{

    display:flex;
    gap:15px;
}

.social button{

    background:#e0e5ec;
    color:#333;
    font-weight:600;

    box-shadow:
    6px 6px 12px #a3b1c6,
    -6px -6px 12px #ffffff;
}

.social button:hover{

    background:#4a90e2;
    color:white;
}

.footer{

    margin-top:28px;
    text-align:center;
    font-size:14px;
    color:#555;
}

.footer a{

    text-decoration:none;
    color:#4a90e2;
    font-weight:600;
}

.footer a:hover{

    text-decoration:underline;
}

@media(max-width:500px){

.container{

    width:90%;
    padding:30px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="avatar">
👤
</div>

<h2>Welcome Back</h2>

<p>Sign in to continue</p>

<form>

<div class="inputBox">
<input type="email" placeholder="Email Address" required>
</div>

<div class="inputBox">
<input type="password" placeholder="Password" required>
</div>

<div class="options">

<label>
<input type="checkbox">
 Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">
Login
</button>

</form>

<div class="divider">
OR
</div>

<div class="social">

<button>
Google
</button>

<button>
GitHub
</button>

</div>

<div class="footer">

Don't have an account?
<a href="#">Sign Up</a>

</div>

</div>

</body>
</html>
